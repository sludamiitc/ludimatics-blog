<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>索引编辑器 · Ludimatics</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; --bd:#d8d3c8; --bg:#fffdf8; --fg:#1a1815; --mut:#857d70; --acc:#2a4a86; --warn:#b4762c; }
  @media (prefers-color-scheme: dark) { :root { --bd:#3a352d; --bg:#1b1917; --fg:#ddd7cb; --mut:#8b8378; --acc:#9db8e8; --warn:#d9a45b; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:1.5rem 1.5rem 8rem; background:var(--bg); color:var(--fg);
         font:14px/1.55 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  h1 { font-size:1.15rem; margin:0 0 .15rem; }
  .sub { color:var(--mut); font-size:.82rem; margin:0 0 1.2rem; }
  .bar { position:sticky; top:0; z-index:9; display:flex; gap:.5rem; flex-wrap:wrap; align-items:center;
         padding:.7rem 0; background:var(--bg); border-bottom:1px solid var(--bd); margin-bottom:1rem; }
  button { font:inherit; padding:.28rem .62rem; border:1px solid var(--bd); border-radius:4px;
           background:transparent; color:var(--fg); cursor:pointer; }
  button:hover { border-color:var(--acc); color:var(--acc); }
  button.primary { border-color:var(--acc); color:var(--acc); }
  button.tab.on { background:var(--acc); color:var(--bg); border-color:var(--acc); }
  .status { margin-left:auto; color:var(--mut); font-size:.8rem; align-self:center; }
  input, select, textarea { width:100%; font:inherit; padding:.26rem .42rem; border:1px solid var(--bd);
                            border-radius:4px; background:transparent; color:var(--fg); }
  textarea { min-height:3rem; resize:vertical; }
  label { display:block; font-size:.7rem; letter-spacing:.06em; color:var(--mut); margin:.4rem 0 .1rem; }
  .list { border:1px solid var(--bd); border-radius:6px; margin-bottom:.7rem; }
  .list > header { display:flex; gap:.5rem; align-items:center; padding:.5rem .7rem; background:color-mix(in srgb, var(--bd) 22%, transparent); }
  .list > header .lt { font-weight:600; }
  .list > header .lc { color:var(--mut); font-size:.78rem; }
  .list > header .grow { flex:1; }
  .body { padding:.7rem; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:.5rem; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:.5rem; }
  table { width:100%; border-collapse:collapse; margin-top:.5rem; }
  th { text-align:left; font-size:.7rem; letter-spacing:.06em; color:var(--mut); font-weight:500; padding:.2rem .3rem; }
  td { padding:.15rem .3rem; border-top:1px solid var(--bd); vertical-align:middle; }
  td.id input { width:5.2rem; font-family:ui-monospace,Consolas,monospace; }
  td.ops { white-space:nowrap; text-align:right; }
  td.ops button { padding:.1rem .34rem; font-size:.8rem; }
  .pool { border:1px dashed var(--bd); border-radius:6px; padding:.6rem .75rem; margin-bottom:1rem; }
  .pool b { font-size:.74rem; letter-spacing:.1em; color:var(--mut); }
  .pool .chips { display:flex; flex-wrap:wrap; gap:.35rem; margin-top:.45rem; }
  .chip { font-family:ui-monospace,Consolas,monospace; font-size:.76rem; border:1px solid var(--bd);
          border-radius:4px; padding:.14rem .4rem; cursor:pointer; }
  .chip:hover { border-color:var(--acc); color:var(--acc); }
  .chip.used { opacity:.4; }
  .mini { font-size:.72rem; color:var(--mut); }
</style>
</head>
<body>
<h1>索引编辑器</h1>
<p class="sub">这里只维护骨架：板块、列表的 id / 标题 / 说明 / 时间跨度。归属（哪篇在哪个列表、列表内编号）写在文章的 <code>meta.lists</code> 里，本页只读。</p>

<div class="bar">
  <button data-tab="list" class="tab">LIST</button>
  <button data-tab="exploration" class="tab">EXPLORATION</button>
  <button id="add-list">＋ 新列表</button>
  <button id="save" class="primary">保存索引</button>
  <button id="reload">重读</button>
  <span class="status" id="status"></span>
</div>

<div class="pool">
  <b>文章池（点一下加入当前板块的最后一个列表）</b>
  <div class="chips" id="pool"></div>
</div>

<div id="lists"></div>

<h2 style="font-size:.95rem;margin:1.6rem 0 .5rem">新建文章</h2>
<div class="grid3">
  <div><label>slug</label><input id="new-slug" placeholder="devlog-tile-raster"></div>
  <div><label>标题</label><input id="new-title" placeholder="按 tile 分块的第一次尝试"></div>
  <div style="display:flex;align-items:flex-end"><button id="create">创建文件（含 meta 骨架）</button></div>
</div>

<script>
let state = { index: null, pool: [], tab: 'list' };
const $ = (id) => document.getElementById(id);
const setStatus = (m) => { $('status').textContent = m; };
const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

async function load() {
  const res = await fetch('/api/index');
  const data = await res.json();
  state.index = data.index;
  state.pool = data.pool;
  render();
  setStatus('已载入');
}

const board = () => state.index.boards[state.tab];
const lists = () => board().lists ?? [];

function render() {
  document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('on', b.dataset.tab === state.tab));

  // 归属：从文章的 meta.lists 反推，只读
  const byList = new Map();
  for (const a of state.pool) {
    for (const p of a.lists ?? []) {
      if (!byList.has(p.list)) byList.set(p.list, []);
      byList.get(p.list).push({ slug: a.slug, id: p.id, note: p.note, title: a.title });
    }
  }
  const itemsOf = (id) => byList.get(id) ?? [];

  // 文章池
  $('pool').innerHTML = state.pool.map((a) => {
    const where = (a.lists ?? []).map((p) => `${p.list}/${p.id}`).join(' ');
    return `<span class="chip ${where ? 'used' : ''}" title="${esc(where || '只进 LIST')}｜${esc(a.title)}">${esc(a.slug)}</span>`;
  }).join('') || '<span class="mini">articles/ 里还没有文件</span>';

  // source=date：列表由文章日期生成，整块只读
  if (board().source === 'date') {
    const years = new Map();
    for (const a of state.pool) {
      const y = (a.date ?? '').slice(0, 4);
      if (!y) continue;
      if (!years.has(y)) years.set(y, []);
      years.get(y).push(a);
    }
    $('lists').innerHTML = `
      <p class="mini" style="margin-bottom:.8rem"><code>source: date</code> —— 年份列表由文章的 <code>meta.date</code> 自动生成，不需要也不能手写。</p>
      ${[...years.entries()]
        .sort((x, y) => (x[0] < y[0] ? 1 : -1))
        .map(([y, arr]) => `
        <section class="list">
          <header><span class="lt">${esc(y)}</span><span class="lc">${arr.length} 篇</span></header>
          <div class="body">
            ${arr.map((a) => `<div class="mini">${esc(a.date.slice(5))} — ${esc(a.title)}</div>`).join('')}
          </div>
        </section>`).join('') || '<p class="mini">articles/ 里还没有已发布文章。</p>'}`;
    return;
  }

  // 列表
  $('lists').innerHTML = lists().map((list, li) => `
    <section class="list" data-li="${li}">
      <header>
        <span class="lt">${esc(list.title || list.id)}</span>
        <span class="lc">${itemsOf(list.id).length} 条</span>
        <span class="grow"></span>
        <button data-op="up">↑</button>
        <button data-op="down">↓</button>
        <button data-op="dellist">删除列表</button>
      </header>
      <div class="body">
        <div class="grid3">
          <div><label>id（URL 段）</label><input data-f="id" value="${esc(list.id)}"></div>
          <div><label>标题</label><input data-f="title" value="${esc(list.title)}"></div>
          <div><label>说明</label><input data-f="desc" value="${esc(list.desc ?? '')}"></div>
        </div>
        <div class="grid2">
          <div><label>时间跨度</label><input data-f="period" value="${esc(list.period ?? '')}" placeholder="2026-11 → 至今"></div>
        </div>
        <table>
          <thead><tr><th style="width:5.5rem">条目 id</th><th>文章（按 list_index → subtitle 排）</th><th style="width:8rem">注记</th></tr></thead>
          <tbody>
            ${itemsOf(list.id).map((it) => `
              <tr>
                <td class="id">${esc(it.id)}</td>
                <td>${esc(it.slug)} — ${esc(it.title)}</td>
                <td>${esc(it.note ?? '')}</td>
              </tr>`).join('') || '<tr><td colspan="3" class="mini">空</td></tr>'}
          </tbody>
        </table>
        <p class="mini" style="margin-top:.5rem">归属写在文章的 <code>meta.lists</code> 里（含 <code>id</code> / <code>list_index</code> / <code>note</code>），本页只读。</p>
      </div>
    </section>`).join('') || '<p class="mini">这个板块还没有列表，点上面「＋ 新列表」。</p>';
}

// 把 UI 上的输入写回 state
function collect() {
  document.querySelectorAll('.list').forEach((el) => {
    const li = Number(el.dataset.li);
    const list = lists()[li];
    el.querySelectorAll('.body > .grid3 [data-f], .body > .grid2 [data-f]').forEach((inp) => {
      const f = inp.dataset.f;
      if (inp.value) list[f] = inp.value; else delete list[f];
    });
  });
}

document.addEventListener('click', async (e) => {
  const t = e.target;
  if (t.dataset.tab) { state.tab = t.dataset.tab; render(); return; }

  if (t.id === 'save') {
    collect();
    const res = await fetch('/api/save', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ index: state.index }),
    });
    const d = await res.json();
    setStatus(d.ok ? '已保存到 index.json' : `失败：${d.error}`);
    return;
  }

  if (t.id === 'reload') { await load(); return; }

  if (t.id === 'add-list') {
    collect();
    if (board().source === 'date') { setStatus('source=date 的板块由日期生成列表，不手动建'); return; }
    const id = prompt('列表 id（小写、连字符，也是 URL 段）');
    if (!id) return;
    lists().push({ id, title: id, desc: '', period: '' });
    render();
    setStatus('新列表未保存');
    return;
  }

  if (t.id === 'create') {
    const slug = $('new-slug').value.trim();
    const title = $('new-title').value.trim();
    const res = await fetch('/api/new', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ slug, title }),
    });
    const d = await res.json();
    if (d.ok) { $('new-slug').value = ''; $('new-title').value = ''; await load(); setStatus(`已创建 articles/${d.file}`); }
    else setStatus(`失败：${d.error}`);
    return;
  }

  if (t.dataset.slug) {
    collect();
    setStatus('把归属写进文章：lists: [{ list, id }]，本页只读');
    return;
  }

  const op = t.dataset.op;
  if (!op) return;
  collect();
  const card = t.closest('.list');
  const li = card ? Number(card.dataset.li) : -1;
  const list = lists()[li];

  if (op === 'up' && li > 0) { const [x] = lists().splice(li, 1); lists().splice(li - 1, 0, x); }
  else if (op === 'down' && li < lists().length - 1) { const [x] = lists().splice(li, 1); lists().splice(li + 1, 0, x); }
  else if (op === 'dellist') { if (!confirm(`删除列表 ${list.id}？（不影响文章文件）`)) return; lists().splice(li, 1); }

  render();
  setStatus('有未保存的改动');
});

load();
</script>
</body>
</html>
